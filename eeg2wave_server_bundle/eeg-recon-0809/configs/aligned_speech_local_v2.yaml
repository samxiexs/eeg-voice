schema_version: aligned_speech_v1
data_config: configs/training_data_aligned_v2.yaml
artifact_root: artifacts/aligned_speech_local_v2
artifact_set: aligned_v2
# Both tasks present the same 402 sentences: Passive doubles the EEG
# observations per sentence (22 participants x 2 tasks) without adding content.
tasks: [N400Active, N400Passive]
# Content roles are copied from the v1 assignment so validation/test sentences
# are identical to v1 and the v1 train-fold HuBERT / HiFi-GAN stay leak-free.
role_source: artifacts/aligned_speech_local_v1/assignment.csv
legacy_m0_manifest: artifacts/training_data/v4_ds004940_fixed/manifests/manifest_explore_m0_ds004940_trial_diverse_v3.csv
split_seed: 31
audio_initialization: project_train_only
objective_only: true
encoder:
  dimension: 192
  heads: 6
  layers: 4
  local_layers: 2
  token_steps: 236
decoder:
  hidden: 256
  layers: 6
minimum_epochs: 20
patience: 10
