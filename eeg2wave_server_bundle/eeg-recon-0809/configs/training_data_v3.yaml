# Harmonized v3 resolves the immutable v2 dataset inventory and overrides only
# behavior changed by the repository/data audit.  The loader hashes the fully
# resolved configuration, including the inherited values.
extends: training_data_v2.yaml

schema_version: training-data-v3
preprocessing_profile: harmonized_v3
output_root: artifacts/training_data/v3
split_seed: eeg-recon-0809-v3-subject-content

pairing_policy:
  verified_exact: [content, timing, acoustic]
  candidate_filename_timing: [weak_content, phoneme]
  label_only: [phoneme]
  none: []

evidence_policy:
  ds004940_human_pair_review_required_for_formal_m0: true

sources:
  ds004940:
    stimulus_inventory_sha256: e4370258f7d8b395ec1879de4826f9e1a9c322ce7c566bcd6cbe9ea6904f9fd3

normalization:
  method: dataset_channel_median_mad
  fit_scope: train_fold_only
  max_samples_per_channel: 200000
  clip: none
  require_single_preprocessing_contract: true

harmonized:
  epoch:
    ds004940:
      variable_valid_length: true
      exclude_boundary_overlap: true

audio:
  content:
    dc_removal: true
    vad_threshold_db_below_peak: 40.0
    mfcc_count_with_c0: 40
    discard_c0: true
    utterance_cmvn: true
    relative_frames: 161
    hubert_model: facebook/hubert-base-ls960
    hubert_layer: 9
    hubert_revision: main
  acoustic:
    preserve_gain: true
    preserve_silence: true

preprocessing_qc:
  trials_per_dataset: 4
  channels_per_trial: 8
  welch_seconds: 1.0
  bands_hz:
    dc: [0.0, 0.5]
    passband: [0.5, 45.0]
    high: [45.0, 100.0]
